<!doctype html>
<html lang="uk">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Прийом металобрухту Львів — МЕТАЛ-ЛЬВІВ</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<header>
  <div class="wrap hero">
    <h1>Прийом металобрухту у Львові</h1>
    <div class="muted">Кілька прийомок по місту</div>
    <div>
      <a class="btn" href="#contact">Залишити заявку</a>
      <a class="btn blue" href="#map-block">Показати на карті</a>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="grid">
    <div class="card">
      <h2>Наші прийомки</h2>
      <div id="locations"></div>
    </div>

    <div class="card" id="map-block">
      <h2>Карта прийомок</h2>
      <div id="map"></div>
    </div>
  </section>

  <section class="card" id="contact">
    <h2>Зворотний зв’язок</h2>

    <form id="contactForm">
      <input name="name" placeholder="Ім'я" required />
      <input name="phone" placeholder="+380..." required />
      <textarea name="message" rows="4"></textarea>
      <button type="submit">Відправити</button>
      <div id="status"></div>
    </form>
  </section>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="./js/main.js"></script>
</body>

</html>
